spring.application.name=careerbridge
server.port=${PORT:8080}

# Embedded H2 database (in memory: data is reloaded from data/jobs.csv on every start)
spring.datasource.url=jdbc:h2:mem:careerbridge
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# The Next.js frontend that may call this API from the browser
careerbridge.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
