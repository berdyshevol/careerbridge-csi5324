# ADR-0009. Tests, and the backend the end-to-end tests start, use a fresh PostgreSQL in Docker:
# the database the deployment uses, never the shared one in .env
spring.datasource.url=jdbc:tc:postgresql:18-alpine:///careerbridge?TC_DAEMON=true
spring.datasource.username=test
spring.datasource.password=test
spring.test.database.replace=none

# Test values for the throw-away database only; the end-to-end tests log in with them too
careerbridge.jwt.secret=test-secret-for-the-throw-away-database-only
careerbridge.demo.applicant-password=Applicant-test-1
careerbridge.demo.second-applicant-password=Applicant-test-2
careerbridge.demo.recruiter-password=Recruiter-test-1
careerbridge.demo.administrator-password=Administrator-test-1
