# ADR-0009. Tests, and the backend the end-to-end tests start, use a fresh PostgreSQL in Docker:
# the database the deployment uses, never the shared one in .env. Without Docker, TestDatabaseFallback
# switches them to in-memory H2
spring.datasource.url=jdbc:tc:postgresql:18-alpine:///careerbridge?TC_DAEMON=true
spring.datasource.username=test
spring.datasource.password=test
spring.test.database.replace=none

# Test values for the throw-away database only; the end-to-end tests log in with them too
careerbridge.jwt.secret=test-secret-for-the-throw-away-database-only
careerbridge.demo.applicant-password=Demo-test-1
careerbridge.demo.recruiter-password=Demo-test-1
careerbridge.demo.administrator-password=Demo-test-1

# STAND-IN (SCRUM-198): the organization the demo recruiter acts for
careerbridge.recruiter-organization=Waco Health Partners

# The end-to-end tests open the recruiter's verification link the way the email would
careerbridge.demo.verification-links=true
careerbridge.demo.reset-links=true

# The tests count postings, so they start without the demo ones (DemoPostingsTest covers them)
careerbridge.demo.postings=false

# ADR-0014: the schema Hibernate derives from the entities, for MigrationsMatchEntitiesTest to compare with
# the one the migrations build
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=target/entities-schema.sql
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.script.append=false
spring.jpa.properties.hibernate.hbm2ddl.delimiter=;
