spring.application.name=careerbridge
server.port=${PORT:8080}

# In memory: data is reloaded from data/jobs.csv on every start
spring.datasource.url=jdbc:h2:mem:careerbridge
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

careerbridge.frontend-origins=${FRONTEND_ORIGINS:http://localhost:3000,https://careerbridge-csi5324.vercel.app}

# Render sets RENDER_GIT_COMMIT
careerbridge.commit=${RENDER_GIT_COMMIT:local}

# ADR-0006. The Dockerfile sets PUBLIC_DEPLOYMENT
careerbridge.public-deployment=${PUBLIC_DEPLOYMENT:false}

# ADR-0007. Local default admin/admin; the Dockerfile clears the password, so the public site has no administrator
careerbridge.admin.username=${ADMIN_USERNAME:admin}
careerbridge.admin.password=${ADMIN_PASSWORD:admin}

# ADR-0010. Without JWT_SECRET the backend signs with a random key, and a restart logs everybody out
careerbridge.jwt.secret=${JWT_SECRET:}
