spring.application.name=careerbridge
server.port=${PORT:8080}

# ADR-0009. PostgreSQL on Neon when DATABASE_URL is set (locally in the git-ignored .env, on Render in its
# environment); without it an in-memory H2 database, reloaded from data/*.csv on every start
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:careerbridge}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

careerbridge.frontend-origins=${FRONTEND_ORIGINS:http://localhost:3000,https://careerbridge-csi5324.vercel.app}

# Render sets RENDER_GIT_COMMIT
careerbridge.commit=${RENDER_GIT_COMMIT:local}

# ADR-0006. The Dockerfile sets PUBLIC_DEPLOYMENT
careerbridge.public-deployment=${PUBLIC_DEPLOYMENT:false}

# ADR-0007. Local default admin/admin; the Dockerfile clears the password, so the public site has no administrator
careerbridge.admin.username=${ADMIN_USERNAME:admin}
careerbridge.admin.password=${ADMIN_PASSWORD:admin}
