spring.application.name=careerbridge
server.port=${PORT:8080}

# ADR-0009. PostgreSQL on Neon when DATABASE_URL is set (locally in the git-ignored .env, on Render in its
# environment); without it an in-memory H2 database, reloaded from data/*.csv on every start
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:careerbridge}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

careerbridge.frontend-origins=${FRONTEND_ORIGINS:http://localhost:3000,https://careerbridge-csi5324.vercel.app}

# Render sets RENDER_GIT_COMMIT
careerbridge.commit=${RENDER_GIT_COMMIT:local}

# ADR-0010. Without JWT_SECRET the backend signs with a random key, and a restart logs everybody out
careerbridge.jwt.secret=${JWT_SECRET:}

# Demo accounts (config/DemoUsers.java); an account whose password is not set is not created
careerbridge.demo.applicant-password=${DEMO_APPLICANT_PASSWORD:}
careerbridge.demo.second-applicant-password=${DEMO_SECOND_APPLICANT_PASSWORD:}
careerbridge.demo.recruiter-password=${DEMO_RECRUITER_PASSWORD:}
careerbridge.demo.administrator-password=${DEMO_ADMINISTRATOR_PASSWORD:}
# The well-known passwords of app/README.md, on an in-memory database only; the Dockerfile sets false
careerbridge.demo.local-passwords=${DEMO_LOCAL_PASSWORDS:true}
